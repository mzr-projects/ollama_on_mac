[project]
name = "ollama-on-mac"
version = "0.1.0"
description = "Chat with a local Ollama gpt-oss:20b model"
readme = "README.md"
authors = [
    { name = "mzr", email = "taghipour.maziar@yahoo.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ollama>=0.6.3",
    "streamlit>=1.66.1",
]

[project.scripts]
ollama-on-mac = "ollama_on_mac:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv.workspace]
members = [
    "ollama-on-mac",
]
